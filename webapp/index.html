<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>ChefBot — кухонный помощник</title>


<link rel="stylesheet" href="styles.css?v=5" />
<script src="/telegram-web-app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot-screen" id="boot-screen">
      <div class="boot-jar">🍯</div>
      <p>Разогреваем кухню…</p>
    </div>
  </div>

  <!-- Шаблоны экранов -->
  <template id="tpl-home">
    <header class="topbar">
      <div class="topbar-title">
        <span class="eyebrow">ChefBot</span>
        <h1>Что будем<br/>готовить?</h1>
      </div>
      <button class="icon-btn" data-action="open-shopping" aria-label="Список покупок">
        🛒<span class="badge" id="shopping-badge" hidden>0</span>
      </button>
    </header>

    <div class="search-bar" data-action="open-search">
      <span class="search-icon">🔎</span>
      <span class="search-placeholder">Название блюда или продукт…</span>
    </div>

    <div class="quick-row">
      <button class="quick-card quick-card--fridge" data-action="open-fridge">
        <span class="quick-emoji">🥕</span>
        <span class="quick-label">Мой<br/>холодильник</span>
      </button>
      <button class="quick-card quick-card--random" data-action="open-random">
        <span class="quick-emoji">🎲</span>
        <span class="quick-label">Что сегодня<br/>приготовить?</span>
      </button>
      <button class="quick-card quick-card--fav" data-action="open-favorites">
        <span class="quick-emoji">❤️</span>
        <span class="quick-label">Избранное</span>
      </button>
    </div>

    <button class="achievements-banner" data-action="open-achievements">
      <span class="achievements-banner-emoji">🏆</span>
      <span class="achievements-banner-text">Мои достижения</span>
      <span class="achievements-banner-progress" id="achievements-progress">…</span>
    </button>

    <h2 class="section-title">Категории</h2>
    <div class="jar-grid" id="category-grid"></div>
  </template>

  <template id="tpl-achievements">
    <header class="topbar topbar--sub">
      <h1>🏆 Достижения</h1>
    </header>
    <p class="hint-text" id="achievements-summary"></p>
    <div id="achievements-list"></div>
  </template>

  <template id="tpl-category">
    <header class="topbar topbar--sub">
      <h1 id="category-title">Категория</h1>
    </header>
    <div class="recipe-list" id="recipe-list"></div>
  </template>

  <template id="tpl-search">
    <header class="topbar topbar--sub">
      <h1>Поиск</h1>
    </header>
    <div class="search-input-wrap">
      <input id="search-input" class="search-input" type="text" inputmode="search"
             placeholder="Например: борщ, курица, до 30 минут" />
    </div>
    <div class="recipe-list" id="search-results"></div>
  </template>

  <template id="tpl-favorites">
    <header class="topbar topbar--sub">
      <h1>❤️ Избранное</h1>
    </header>
    <div class="recipe-list" id="favorites-list"></div>
  </template>

  <template id="tpl-fridge">
    <header class="topbar topbar--sub">
      <h1>🥕 Мой холодильник</h1>
    </header>
    <p class="hint-text">Отметьте, что у вас есть дома — подберём рецепты по совпадению продуктов.</p>
    <div class="chip-grid" id="fridge-chips"></div>

    <div class="search-input-wrap">
      <input id="fridge-search-input" class="search-input" type="text" inputmode="search"
             placeholder="Другой продукт…" />
    </div>
    <div class="chip-grid" id="fridge-search-results"></div>

    <div class="chip-grid" id="fridge-selected-extra"></div>
    <div class="fridge-results" id="fridge-results"></div>
  </template>

  <template id="tpl-recipe">
    <header class="topbar topbar--sub topbar--recipe">
      <h1 id="recipe-title">Рецепт</h1>
      <div class="topbar-actions">
        <button class="icon-btn icon-btn--ghost" id="recipe-share-btn" aria-label="Поделиться">📤</button>
        <button class="icon-btn icon-btn--ghost" id="recipe-edit-btn" aria-label="Редактировать">✏️</button>
        <button class="icon-btn icon-btn--ghost" id="recipe-fav-btn" aria-label="В избранное">🤍</button>
      </div>
    </header>

    <div class="recipe-hero-photo" id="recipe-hero-photo" hidden></div>
    <div class="recipe-meta" id="recipe-meta"></div>
    <p class="recipe-description" id="recipe-description"></p>
    <p class="recipe-source" id="recipe-source" hidden></p>

    <div class="portions-row">
      <span class="portions-label">👨‍👩‍👧 Порции</span>
      <div class="portions-control" id="portions-control"></div>
    </div>

    <h2 class="section-title">Продукты</h2>
    <ul class="ingredient-list" id="ingredient-list"></ul>

    <div class="recipe-actions">
      <button class="btn btn--primary" data-action="add-to-shopping">🛒 Добавить в покупки</button>
      <button class="btn btn--secondary" data-action="start-cooking">👨‍🍳 Начать готовить</button>
    </div>
  </template>

  <template id="tpl-recipe-edit">
    <header class="topbar topbar--sub">
      <h1>✏️ Свои правки</h1>
    </header>
    <p class="hint-text">
      Правки видны только вам — сам рецепт для всех остальных не меняется.
    </p>

    <h2 class="section-title">Время приготовления</h2>
    <div class="search-input-wrap">
      <input id="edit-time-input" class="search-input" type="number" inputmode="numeric" min="1" placeholder="Например, 5" />
    </div>

    <h2 class="section-title">Заметки к шагам</h2>
    <div id="edit-steps-list"></div>

    <div class="recipe-actions">
      <button class="btn btn--primary" id="edit-save-btn">💾 Сохранить</button>
      <button class="btn btn--ghost" id="edit-reset-btn">↩️ Сбросить к оригиналу</button>
    </div>
  </template>

  <template id="tpl-cooking">
    <header class="topbar topbar--sub">
      <h1 id="cooking-recipe-name">Готовим</h1>
    </header>
    <div class="cooking-progress" id="cooking-progress"></div>
    <div class="cooking-step" id="cooking-step"></div>
    <div class="cooking-nav">
      <button class="btn btn--ghost" id="cooking-prev">⬅ Назад</button>
      <button class="btn btn--primary" id="cooking-next">Далее ➡</button>
    </div>
  </template>

  <template id="tpl-shopping">
    <header class="topbar topbar--sub">
      <h1>🛒 Список покупок</h1>
    </header>
    <ul class="shopping-list" id="shopping-list"></ul>
    <p class="empty-state" id="shopping-empty" hidden>Список пуст. Добавляйте продукты со страницы рецепта.</p>
    <button class="btn btn--ghost btn--block" id="clear-checked-btn">🗑 Очистить купленное</button>
  </template>

  <script src="app.js?v=12"></script>
</body>
</html>
